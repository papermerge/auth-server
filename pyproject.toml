[project]
name = "auth-server"
version = "1.2"
description = "Papermerge auth server"
authors = [
    {name = "Eugen Ciur", email = "eugen@papermerge.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.135.3",
    "sqlalchemy>=2.0.49",
    "passlib>=1.7.4",
    "python-multipart>=0.0.26",
    "rich>=15.0.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "pydantic-settings>=2.13.1",
    "typer>=0.24.1",
    "pyjwt>=2.12.1",
    "psycopg2-binary"
]

[project.scripts]
auth-cli = "auth_server.cli.cli:app"
create_db = "auth_server.cli.create_db:cli"

[dependency-groups]
dev = [
    "taskipy>=1.14.1",
    "pytest>=9.0.3",
    "pytest-env>=1.6.0",
]

[tool.taskipy.tasks]
server = "fastapi dev auth_server/main.py --port 4010"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auth_server"]
